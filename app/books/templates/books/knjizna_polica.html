<!DOCTYPE html>
<html>
<head>
    <title>Knjižna polica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <nav class="navbar navbar-light bg-white shadow-sm px-4 mb-4">
        
        <div class="d-flex align-items-center w-100 justify-content-between">
            
            <div class="d-flex gap-3">
                <span id="korisnik-ime"></span>
                <a href="/books/dodaj/">Dodaj knjigu</a>
            </div>
            
            <div>
                <form id="search-form" class="d-flex gap-2">
                    <input type="text" id="titleSerch" placeholder="Naslov">
                    <input type="text" id="authorSerch" placeholder="Autor">
                    <button type="submit" class="btn btn-primary btn-sm"> Pretrzi </button>
                </form>
            </div>
            
            <div>
                <button onclick="odjava()" class="btn btn-secondary btn-sm">Odjava</button>
            </div>
            
        </div>
    </nav>

    
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h1 id="naslov-stranice" class="mb-0">Sve knjige</h1>
        <div class="btn-group">
            <button onclick="prikaziSveKnjige()" id="btn-sve" class="btn btn-primary">Sve knjige</button>
            <button onclick="prikaziMojuPolicu()" id="btn-moja" class="btn btn-outline-primary">Moja polica</button>
        </div>
    </div>

    <div id="books-lista" class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">
        <p>Učitavanje...</p>
    </div>

    <!-- <div id="books-lista"><p>Učitavanje...</p></div> -->

    <div class="model fade" id="model" tabindex="-1">
        <div class="model-dialog">
            <div class="model-content">
                <div class="model-header">
                    <h5 class="model-title">Anzuriraj knjigu</h5>
                    <button type="button" class="btn-close" onclick="zatvoriModal()"></button>
                </div>

                <div class="modal-body d-flex flex-column gap-2">
                    <input id="edit-naslov" class="form-control" placeholder="Naslov" />
                    <input id="edit-autor" class="form-control" placeholder="Autor" />
                    <input id="edit-isbn" class="form-control" placeholder="ISBN" />
                    <input id="edit-zanr" class="form-control" placeholder="Žanr" />
                    <input id="edit-godina" class="form-control" placeholder="Godina izdanja" type="number" />
                    <textarea id="edit-opis" class="form-control" placeholder="Opis" rows="3"></textarea>
                </div>
                
                <div class="modal-footer">
                    <button onclick="zatvoriModal()" class="btn btn-secondary">Odustani</button>
                    <button onclick="spremiAzuriranje()" class="btn btn-primary">Spremi</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        let aktivnaKnjigaId = null;
        let trenutniPrikaz = 'sve'; // track which view is active

        if (!token) {
            window.location.href = '/auth/login/';
        }

        document.getElementById('korisnik-ime').innerText = `Dobrodošao, ${user.ime}`;

        document.getElementById('search-form').addEventListener('submit', function(e) {
            e.preventDefault(); // stops page reload
            const naslov = document.getElementById('titleSerch').value.trim();
            const autor = document.getElementById('authorSerch').value.trim();
            pretraziKnjige(naslov, autor);
        });

        function odjava() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user');
            window.location.href = '/auth/login/';
        }

        async function prikaziSveKnjige() {
            trenutniPrikaz = 'sve';
            document.getElementById('naslov-stranice').innerText = 'Sve knjige';
            document.getElementById('btn-sve').disabled = true;
            document.getElementById('btn-moja').disabled = false;

            const response = await fetch('/api/books/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.status === 401) { odjava(); return; }

            const data = await response.json();
            prikaziKnjige(data.books, false); // false = don't show edit/delete for all books
        }

        async function prikaziMojuPolicu() {
            trenutniPrikaz = 'moja';
            document.getElementById('naslov-stranice').innerText = 'Moja polica';
            document.getElementById('btn-sve').disabled = false;
            document.getElementById('btn-moja').disabled = true;

            const response = await fetch('/api/books/moja-polica/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.status === 401) { odjava(); return; }

            const data = await response.json();
            prikaziKnjige(data.books, true); // true = show edit/delete buttons
        }

        async function pretraziKnjige(naslov, autor) {
            const params = new URLSearchParams();
            if (naslov) params.append('naslov', naslov);
            if (autor) params.append('autor', autor);

            document.getElementById('btn-sve').disabled = false;
            document.getElementById('btn-moja').disabled = false;

            const response = await fetch(`/api/books/?${params.toString()}`, {
                headers : {'Authorization' : `Bearer ${token}`}
            });

            if (response.status === 401) { odjava(); return; }
            
            const data =    await response.json();
            document.getElementById('naslov-stranice').innerText = 'Rezultati pretrage';
            prikaziKnjige(data.books, trenutniPrikaz === 'moja');
        }

        function prikaziKnjige(books, showActions) {
            const lista = document.getElementById('books-lista');

            if (books.length === 0) {
                lista.innerHTML = '<p class="text-muted">Nema knjiga.</p>';
                return;
            }
            
            lista.innerHTML = books.map(knjiga => `
                <div class="col" id="knjiga-${knjiga.id}">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column">
                            <a href="/books/${knjiga.id}/" class="text-decoration-none text-dark">
                                <h6 class="card-title fw-bold">${knjiga.naslov}</h6>
                            </a>
                            <p class="card-text text-muted small mb-1">${knjiga.autor}</p>
                            <p class="card-text text-muted small">${knjiga.godina_izdanja}</p>
                            <p class="card-text mt-auto">
                                <span class="badge bg-warning text-dark">
                                    ⭐ ${knjiga.prosjecna_ocjena?.toFixed(1) ?? 'N/A'}
                                </span>
                            </p>
                            ${showActions ? `
                                <div class="d-flex gap-2 mt-2">
                                    <button class="btn btn-outline-primary btn-sm flex-fill"
                                        onclick="otvoriModal(${knjiga.id}, '${knjiga.naslov}', '${knjiga.autor}', '${knjiga.isbn}', '${knjiga.zanr ?? ''}', ${knjiga.godina_izdanja}, '${knjiga.opis ?? ''}')">
                                        Ažuriraj
                                    </button>
                                    <button class="btn btn-outline-danger btn-sm flex-fill"
                                        onclick="obrisiKnjigu(${knjiga.id})">
                                        Obriši
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
        `).join('');

        }

        async function obrisiKnjigu(id) {
            if (!confirm('Jesi li siguran?')) return;
            const response = await fetch(`/api/books/${id}/obrisi/`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                document.getElementById(`knjiga-${id}`).remove();
            }
        }

        function otvoriModal(id, naslov, autor, isbn, zanr, godina, opis) {
            aktivnaKnjigaId = id;
            document.getElementById('edit-naslov').value = naslov;
            document.getElementById('edit-autor').value = autor;
            document.getElementById('edit-isbn').value = isbn;
            document.getElementById('edit-zanr').value = zanr;
            document.getElementById('edit-godina').value = godina;
            document.getElementById('edit-opis').value = opis;
            bootstrapModal.show();
            // document.getElementById('modal').style.display = 'block';
        }

        function zatvoriModal() {
            aktivnaKnjigaId = null;
            bootstrapModal.hide();  
            // document.getElementById('modal').style.display = 'none';
        }

        async function spremiAzuriranje() {
            const response = await fetch(`/api/books/${aktivnaKnjigaId}/uredi/`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    naslov: document.getElementById('edit-naslov').value,
                    autor: document.getElementById('edit-autor').value,
                    isbn: document.getElementById('edit-isbn').value,
                    zanr: document.getElementById('edit-zanr').value,
                    godina_izdanja: parseInt(document.getElementById('edit-godina').value),
                    opis: document.getElementById('edit-opis').value,
                })
            });
            if (response.ok) {
                zatvoriModal();
                prikaziMojuPolicu(); // reload personal shelf after update
            }
        }

        // load all books by default on page load
        prikaziSveKnjige();
    </script>
</body>
</html>
