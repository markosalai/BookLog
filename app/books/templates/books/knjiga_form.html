<!DOCTYPE html>
<html>
<head>
    <title>Dodaj knjigu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1 class="text-center mt-2">Dodaj knjigu</h1>
    <div id="error" style="color:red"></div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex flex-column gap-3">
                    <div>
                        <label for="naslov" class="form-label">Unesite naslov</label>
                        <input type="text" id="naslov" placeholder="Naslov" class="form-control"/>
                    </div>
                    
                    <div>
                        <label for="autor" class="form-label" class="form-label">Unesite autora</label>
                        <input type="text" id="autor" placeholder="Autor" class="form-control"/>
                    </div>
                    
                    <div>
                        <label for="isbn" class="form-label">Unesite ISBN</label>
                        <input type="text" id="isbn" placeholder="ISBN" class="form-control"/>
                    </div>
                    
                    <div>
                        <label for="zanr" class="form-label">Unesite Zanr</label>
                        <input type="text" id="zanr" placeholder="Žanr" class="form-control"/>
                    </div>
                    
                    <div>
                        <label for="godina_izdanja" class="form-label"> Unesite godinu izdanja</label>
                        <input type="number" id="godina_izdanja" placeholder="Godina izdanja" class="form-control"/>
                    </div>
                    
                    <div>
                        <label for="opis" class="form-label">Unesite opis knjige</label>
                        <textarea id="opis" placeholder="Opis" class="form-control"></textarea>
                    </div>
                    
                    <div>
                        <button onclick="dodajKnjigu()" class="btn btn-success">Spremi</button>
                        <a href="/books/" class="btn btn-danger">Odustani</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    
        
    
    

    <script>

        function getCsrfToken() {
            return document.cookie.split(';')
                .find(c => c.trim().startsWith('csrftoken='))
                ?.split('=')[1] ?? '';
        }
        const token = localStorage.getItem('access_token');

        if (!token) {
            window.location.href = '/auth/login/';
        }

        async function dodajKnjigu() {
            document.querySelectorAll('.invalid-feedback').forEach(el => el.remove());
            document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));

            const response = await fetch('/api/books/dodaj/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify({
                    naslov: document.getElementById('naslov').value,
                    autor: document.getElementById('autor').value,
                    isbn: document.getElementById('isbn').value,
                    zanr: document.getElementById('zanr').value,
                    godina_izdanja: parseInt(document.getElementById('godina_izdanja').value),
                    opis: document.getElementById('opis').value,
                })
            });

            if (response.ok) {
                window.location.href = '/books/';
            } else {
                const data = await response.json();

                if (data.errors) {
                    Object.entries(data.errors).forEach(([field, message]) => {
                        const input = document.getElementById(field);
                        if (input) {
                            input.classList.add('is-invalid');
                            const feedback = document.createElement('div');
                            feedback.className = 'invalid-feedback';
                            feedback.innerText = message;
                            input.after(feedback);
                        }
                    });
                }
                
                if (data.error) {
                    document.getElementById('error').innerText = data.error;
                }
            }
        }
    </script>
</body>
</html>
