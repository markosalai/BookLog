{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BookLog{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'books/css/dark.css' %}" rel="stylesheet">
    <link rel="icon" href="{% static 'books/img/logo.svg' %}" />
    {% block extra_head %}{% endblock %}
    <style>
      body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
      .container-narrow{ max-width:1200px; margin:0 auto; padding: 24px; }
    </style>
</head>
<body class="bg-dark text-light">

  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container container-narrow d-flex gap-3 align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="/books/">
        <img src="{% static 'books/img/logo.svg' %}" alt="logo" width="36" height="36" style="filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));">
        <span class="fw-bold">BookLog</span>
      </a>

      <div class="mx-3 d-none d-md-block" style="min-width:360px;">
        <form id="search-form" class="d-flex gap-2 align-items-center">
          <input type="text" id="titleSerch" class="form-control form-control-sm" placeholder="Naslov">
          <input type="text" id="authorSerch" class="form-control form-control-sm" placeholder="Autor">
          <button class="btn btn-primary btn-sm" type="submit">Pretraži</button>
        </form>
      </div>

      <div class="ms-auto d-flex align-items-center gap-2 nav-actions">
        <span id="korisnik-ime" class="me-2 muted-small"></span>
        <div class="d-flex gap-2">
          <a href="/books/" class="btn btn-outline-light btn-sm">Knjige</a>
          <a href="/books/dodaj/" class="btn btn-outline-light btn-sm">Dodaj knjigu</a>
          <a href="/auth/login/" id="auth-action" class="btn btn-outline-light btn-sm">Prijava</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container container-narrow">
    {% block content %}{% endblock %}
  </main>

  <footer class="mt-5 py-4 border-top" style="border-color: rgba(255,255,255,0.03)">
    <div class="container container-narrow text-center text-muted small">© BookLog — UI enhanced</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      const authButton = document.getElementById('auth-action');
      const userLabel = document.getElementById('korisnik-ime');
      const token = localStorage.getItem('access_token');
      const user = JSON.parse(localStorage.getItem('user') || '{}');

      if (token) {
        if (userLabel && user.ime) {
          userLabel.textContent = `Dobrodošao, ${user.ime}`;
        }

        if (authButton) {
          authButton.textContent = 'Odjava';
          authButton.href = '#';
          authButton.addEventListener('click', function (event) {
            event.preventDefault();
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user');
            window.location.href = '/auth/login/';
          });
        }
      } else if (authButton) {
        authButton.textContent = 'Prijava';
        authButton.href = '/auth/login/';
      }
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
