<!DOCTYPE html>
<html>
<head>
    <title>Registracija</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container min-vh-100 d-flex align-items-center">
        <div class="row justify-content-center w-100">
            <div class="col-md-4">
            
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="mb-4 fw-bold text-center">Registracija</h3>
                        <div id="error" class="text-danger text-center mb-2"></div>

                        <div class="mb-3">
                            <label class="form-label">Ime</label>
                            <input type="text" id="ime" placeholder="Ime" class="form-control"/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" placeholder="Email" class="form-control"/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Lozinka</label>
                            <input type="password" id="password" placeholder="Lozinka" class="form-control"/>
                        </div>
                        
                        <button onclick="registracija()" class="btn btn-primary">Registriraj se</button>
                        <p>Već imate račun? <a href="/auth/login/">Prijavite se</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
        

    <script>
        function validEmail(email){
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }
        
        async function registracija() {
            const ime = document.getElementById('ime').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');

            errorEl.innerHTML = '';

            if (!ime || !email || !password) {
                errorEl.innerText = 'Sva polja su obavezna.';
                return;
            }

            if (!validEmail(email)) {
                errorEl.innerText = 'Unesite ispravan email.';
                return;
            }

            const response = await fetch('/api/auth/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ime, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/books/';
            } else {
                errorEl.innerHTML = data.error;
            }
        }



    </script>
</body>
</html>
