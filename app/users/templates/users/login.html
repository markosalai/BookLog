<!DOCTYPE html>
<html>
<head>
    <title>Prijava</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <div class="container min-vh-100 d-flex align-items-center">
        <div class="row justify-content-center w-100">
            <div class="col-md-4">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="mb-4 fw-bold text-center">Prijava</h3>
                        <div id="error" class="text-danger text-center mb-2"></div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" placeholder="Email" class="form-control"/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Lozinka</label>
                            <input type="password" id="password" placeholder="Lozinka" class="form-control"/>
                        </div>
                        
                        <button onclick="prijava()" class="btn btn-primary">Prijava</button>
                        <p>Nemate račun? <a href="/auth/register/">Registrirajte se</a></p>

                    </div>
                </div>            
            </div>
        </div>
    </div>
    
    

    <script>
        // redirect if already logged in
        if (localStorage.getItem('access_token')) {
            window.location.href = '/books/';
        }

        async function prijava() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/api/auth/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/books/';
            } else {
                document.getElementById('error').innerText = data.error;
            }
        }
    </script>
</body>
</html>
